<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <meta name="keywords" content="{{ site.keywords }}" />
    <link rel="canonical" href="{{ site.canonical }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="image avatar">
          <img src="{{ site.avatar | relative_url }}" alt="{{ site.title }}" />
        </div>

        <h1>{{ site.title }}</h1>
        <position>{{ site.position }}</position>
        <autocolor>
          <a href="{{ site.affiliation_link }}">{{ site.affiliation }}</a>
        </autocolor>
        <autocolor>
          <a href="{{ site.subaffiliation_link }}">{{ site.subaffiliation }}</a>
        </autocolor>
        <email>{{ site.email }}</email>

        <div class="side-links" aria-label="Profile links">
          <a href="mailto:{{ site.email }}">Email</a>
          <a href="{{ site.github_link }}" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </header>

      <section>
        {{ content }}
      </section>
    </div>
  </body>
</html>
