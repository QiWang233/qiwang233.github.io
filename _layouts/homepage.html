<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <meta name="keywords" content="{{ site.keywords }}" />
    <link rel="canonical" href="{{ site.canonical }}" />
    <link rel="icon" type="image/svg+xml" href="{{ site.favicon | relative_url }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css" integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css" integrity="sha256-+N4/V/SbAFiW1MPBCXnfnP9QSN3+Keu+NlB+0ev/YKQ=" crossorigin="anonymous" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision | default: '20260710' }}" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="image avatar">
          <img src="{{ site.avatar | relative_url }}" alt="{{ site.title }}" />
        </div>

        <div class="profile-details">
          <h1>{{ site.title }}</h1>
          <a class="email" href="mailto:{{ site.email }}">{{ site.email }}</a>

          <div class="social-icons" aria-label="Academic profiles">
            {% if site.google_scholar %}
            <a href="{{ site.google_scholar }}" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" title="Google Scholar">
              <i class="ai ai-google-scholar" aria-hidden="true"></i>
            </a>
            {% endif %}
            {% if site.cv_link %}
            <a href="{{ site.cv_link | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="Curriculum Vitae (PDF)" title="Curriculum Vitae">
              <i class="ai ai-cv" aria-hidden="true"></i>
            </a>
            {% endif %}
            {% if site.github_link %}
            <a href="{{ site.github_link }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
              <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            {% endif %}
          </div>
        </div>
      </header>

      <section>
        {{ content }}
      </section>
    </div>
  </body>
</html>
